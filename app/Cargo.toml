[package]
name = "facet"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_20"] }
libadwaita = { version = "0.9.2", features = ["v1_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webkit6 = { version = "0.6.1", features = ["v2_50"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
