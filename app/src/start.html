<!doctype html>
<html><head><meta charset="utf-8"><title>New Tab</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fbfbfd;--fg:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.08);--chip:rgba(255,255,255,.62);--glow:.55}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f5f5f7;--muted:#98989d;--line:rgba(255,255,255,.1);--chip:rgba(255,255,255,.07);--glow:.42}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.aurora{position:fixed;inset:-25%;filter:blur(90px);opacity:var(--glow);pointer-events:none}
.aurora i{position:absolute;width:55%;height:55%;border-radius:50%;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:6%;top:4%;background:var(--a)}
.aurora i:nth-child(2){right:4%;top:18%;background:var(--b);animation-delay:-9s}
.aurora i:nth-child(3){left:28%;bottom:0;background:var(--c);animation-delay:-17s}
@keyframes drift{to{transform:translate(9%,7%) scale(1.18)}}
@media(prefers-reduced-motion:reduce){.aurora i,main{animation:none!important}}
main{position:relative;width:min(640px,88vw);text-align:center;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
#clock{font-size:clamp(64px,13vw,124px);font-weight:200;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
#hello{margin:10px 0 34px;color:var(--muted);font-size:17px}
form{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-radius:18px;background:var(--chip);border:1px solid var(--line);backdrop-filter:blur(24px);box-shadow:0 18px 50px rgba(0,0,0,.18);transition:box-shadow .18s,transform .18s}
form:focus-within{transform:translateY(-1px);box-shadow:0 0 0 2px var(--a),0 22px 60px rgba(0,0,0,.26)}
form svg{flex:none;opacity:.55}
input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit;font-size:17px}
input::placeholder{color:var(--muted)}
#tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:34px}
#tiles a{width:84px;color:inherit;text-decoration:none;font-size:12px;transition:transform .16s cubic-bezier(.2,.8,.2,1)}
#tiles a:hover{transform:translateY(-4px) scale(1.05)}
#tiles span{display:block;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tile{display:grid;place-items:center;width:58px;height:58px;margin:auto;border-radius:16px;background:var(--chip);border:1px solid var(--line);font-size:23px;font-weight:600;overflow:hidden}
.tile img{width:32px;height:32px}
#hint{margin-top:30px;color:var(--muted);font-size:13px}
kbd{padding:2px 6px;border-radius:5px;background:var(--chip);border:1px solid var(--line);font:inherit;font-size:12px}
</style></head><body>
<div class="aurora"><i></i><i></i><i></i></div>
<main>
<div id="clock"></div><div id="hello"></div>
<form action="https://duckduckgo.com/" method="get">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
<input name="q" placeholder="Search the web" autocomplete="off" autofocus></form>
<div id="tiles"></div><div id="hint"></div>
</main>
<script>
/*DATA*/
const P=[["#0a84ff","#5e5ce6","#64d2ff"],["#bf5af2","#ff375f","#5e5ce6"],["#30d158","#64d2ff","#0a84ff"],["#ff9f0a","#ff375f","#ffd60a"],["#ff375f","#bf5af2","#ff9f0a"],["#64d2ff","#30d158","#5e5ce6"]];
const t=P[+new URLSearchParams(location.search).get("tint")%P.length]||P[0];
["--a","--b","--c"].forEach((k,i)=>document.documentElement.style.setProperty(k,t[i]));
function tick(){const d=new Date(),h=d.getHours();
clock.textContent=d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/i,"");
hello.textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+" · "+d.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});}
tick();setInterval(tick,1000);
for(const url of FAVORITES){let u;try{u=new URL(url)}catch{continue}
if(!/^https?:$/.test(u.protocol))continue;
const host=u.hostname.replace(/^www\./,""),a=document.createElement("a"),b=document.createElement("div"),s=document.createElement("span"),i=new Image();
a.href=url;b.className="tile";s.textContent=host;i.src=u.origin+"/favicon.ico";
i.onerror=()=>{b.textContent=host[0].toUpperCase()};b.append(i);a.append(b,s);tiles.append(a);}
hint.innerHTML=FAVORITES.length?"<kbd>Ctrl K</kbd> command bar":"Press <kbd>Ctrl D</kbd> on any site to pin it here";
</script></body></html>
