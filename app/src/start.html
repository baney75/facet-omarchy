<!doctype html>
<html><head><meta charset="utf-8"><title>New Tab</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:rgba(255,255,255,.22);--fg:#1d1d1f;--muted:#3a3a3e;--line:rgba(0,0,0,.14);--box:rgba(255,255,255,.72);--tile:rgba(0,0,0,.05);--slab:rgba(0,0,0,.22)}
@media(prefers-color-scheme:dark){:root{--bg:rgba(8,8,12,.26);--fg:#f5f5f7;--muted:#e5e5ea;--line:rgba(255,255,255,.16);--box:rgba(20,20,26,.62);--tile:rgba(255,255,255,.16);--slab:rgba(255,255,255,.55)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 Inter,system-ui,sans-serif;letter-spacing:-.01em;display:flex;justify-content:center;padding-top:18vh;overflow:hidden}
main{width:min(460px,86vw);animation:rise .5s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
@media(prefers-reduced-motion:reduce){main{animation:none}}
.slabs{display:block;width:132px;margin:0 auto 42px;fill:none;stroke:var(--slab);stroke-width:1.2;stroke-linejoin:round}
form{border-radius:14px;background:var(--box);border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.28);padding:9px 8px 8px 16px;transition:box-shadow .2s cubic-bezier(.22,1,.36,1)}
form:focus-within{box-shadow:0 0 0 1.5px #0a84ff,0 20px 50px rgba(0,0,0,.34)}
.top{display:flex;align-items:center;gap:10px;height:34px}
.top svg{flex:none;opacity:.6}
input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit;font-size:15.5px}
input::placeholder{color:var(--muted)}
.row{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
button{width:28px;height:28px;border:0;border-radius:50%;background:var(--tile);color:inherit;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .15s cubic-bezier(.22,1,.36,1)}
button:hover{background:#0a84ff;color:#fff}
button:active{transform:scale(.92)}
#tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}
#tiles a{width:68px;color:var(--muted);text-decoration:none;font-size:11px;text-align:center;transition:transform .2s cubic-bezier(.22,1,.36,1)}
#tiles a:hover{transform:translateY(-3px)}
#tiles span{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{display:grid;place-items:center;width:44px;height:44px;margin:auto;border-radius:12px;background:var(--tile);font-size:18px;font-weight:600;color:var(--fg);overflow:hidden}
.tile img{width:24px;height:24px}
</style></head><body>
<main>
<svg class="slabs" viewBox="0 0 132 84"><path d="M14 11 96 2a4 4 0 0 1 4.4 4.8l-7 30a5 5 0 0 1-4.3 3.8L9 49a4 4 0 0 1-4.4-4.9l6-29.6A4.4 4.4 0 0 1 14 11Z"/><path d="M36 42l82-9a4 4 0 0 1 4.4 4.8l-7 30a5 5 0 0 1-4.3 3.8L31 80a4 4 0 0 1-4.4-4.9l6-29.6A4.4 4.4 0 0 1 36 42Z"/></svg>
<form id="f">
<div class="top"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
<input id="q" placeholder="Search or ask anything..." autocomplete="off" autofocus></div>
<div class="row"><button type="submit" title="Go"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
</form>
<div id="tiles"></div>
</main>
<script>
/*DATA*/
f.onsubmit=(e)=>{e.preventDefault();const t=q.value.trim();if(!t)return;
location.href=/^\S+\.\S+$/.test(t)&&!/\s/.test(t)?(/:\/\//.test(t)?t:"https://"+t):SEARCH+encodeURIComponent(t);};
for(const url of FAVORITES){let u;try{u=new URL(url)}catch{continue}
if(!/^https?:$/.test(u.protocol))continue;
const host=u.hostname.replace(/^www\./,""),a=document.createElement("a"),b=document.createElement("div"),s=document.createElement("span"),i=new Image();
a.href=url;b.className="tile";s.textContent=host;i.src=u.origin+"/favicon.ico";
i.onerror=()=>{b.textContent=host[0].toUpperCase()};b.append(i);a.append(b,s);tiles.append(a);}
</script></body></html>
