<!doctype html>
<meta charset="utf-8">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
<main>
  <div id="clock"></div>
  <form id="search"><input id="q" placeholder="Search or enter address" autocomplete="off" autofocus></form>
  <section><h2>Spaces</h2><div id="spaces" class="chips"></div></section>
  <section><h2>Bookmarks</h2><div id="bookmarks" class="chips"></div></section>
  <section><h2>Most visited</h2><div id="sites" class="chips"></div></section>
  <section><h2>Recently closed</h2><div id="recent" class="chips"></div></section>
  <p class="hint">Ctrl+K opens the command palette.</p>
</main>
<script type="module" src="newtab.js"></script>
